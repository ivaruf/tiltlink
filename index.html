<!doctype html>
<!--
  TiltLink — a tech demo, not a game yet.

  One page, two roles. Opened plainly it is the STAGE: it takes a picture
  code, shows it as a QR, and draws one ball per connected phone. Opened as
  #join=<code> (what the QR says) it is the PAD: the phone's tilt goes to the
  stage over WebRTC and rolls that phone's ball. See README.md.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0e1a" />
    <title>TiltLink</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/touch-guard.js"></script>
    <!-- Classic script, defines the global `qrcode`. Vendored, so drawing a
         QR asks nobody anything. -->
    <script src="vendor/qrcode.js"></script>
    <script>
      // Tiny crash bar: a module script reports its whole graph through one
      // tag, so this names the entry point, not the import that failed.
      // Tags marked data-handled (the PeerJS loader) are dealt with already.
      addEventListener(
        "error",
        (e) => {
          if (e.target?.dataset?.handled) return;
          const bar = document.getElementById("crash");
          if (!bar) return;
          bar.hidden = false;
          bar.textContent =
            "Something broke: " +
            (e.message || (e.target?.src ?? "a file") + " (or one it imports) failed to load");
        },
        true,
      );
    </script>
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div id="crash" hidden></div>

    <!-- Choose a role: only shown when the URL did not already say. -->
    <section id="home" class="screen" hidden>
      <h1 class="wordmark">Tilt<span>Link</span></h1>
      <p class="lede">Your phone moves something on the big screen.</p>
      <div class="doors">
        <button id="go-stage" class="pill primary">This is the big screen</button>
        <button id="go-keypad" class="pill">Join with a code</button>
      </div>
    </section>

    <!-- The big screen. -->
    <section id="stage" hidden>
      <canvas id="arena"></canvas>
      <aside id="join-card" class="card">
        <canvas id="qr" width="232" height="232" aria-label="QR code to join"></canvas>
        <div class="join-text">
          <p class="label">Scan to join, or tap in</p>
          <p id="code-icons" class="code-icons"></p>
          <p id="code-names" class="code-names"></p>
          <p id="join-url" class="join-url"></p>
          <p id="stage-status" class="status"></p>
        </div>
      </aside>
      <ul id="roster" aria-live="polite"></ul>
      <p id="empty-hint" class="empty-hint">Waiting for phones…</p>
    </section>

    <!-- A phone without a code: twelve pictures, three slots. -->
    <section id="keypad" class="screen" hidden>
      <h2 class="label">Tap the three pictures on the screen</h2>
      <div id="slots" class="slots" aria-live="polite"></div>
      <div id="keys" class="keys"></div>
      <div class="doors">
        <button id="key-clear" class="pill">Clear</button>
        <button id="key-join" class="pill primary" disabled>Join</button>
      </div>
    </section>

    <!-- A phone with a code. -->
    <section id="pad" class="screen" hidden>
      <div id="pad-connect" class="pad-face">
        <p id="pad-code" class="code-icons"></p>
        <button id="pad-go" class="pill primary big">Connect</button>
        <p id="pad-error" class="status"></p>
      </div>
      <div id="pad-live" class="pad-face" hidden>
        <div id="tray" class="tray" aria-label="Tilt or drag here">
          <div id="tray-dot" class="tray-dot"></div>
        </div>
        <p id="pad-mode" class="status"></p>
        <div class="doors">
          <button id="pad-zero" class="pill">Level</button>
          <button id="pad-tap" class="pill primary">Pulse</button>
        </div>
        <p id="pad-path" class="status small"></p>
      </div>
    </section>
  </body>
</html>
